spring:
  # 数据源配置
  datasource:
    url: jdbc:mysql://localhost:3306/media_website?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 2GB
    max-request-size: 2GB

# MyBatis 配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.media.website.entity
  configuration:
    map-underscore-to-camel-case: true

# 应用配置
server:
  port: 8081

# 文件存储配置
file:
  upload:
    path: /data/media/uploads
    url-prefix: /uploads

# JWT配置
jwt:
  secret: ${JWT_SECRET:hight-go-media-website-secret-key-2024}
  expiration: 86400000
