spring:
  # 数据源配置
  datasource:
    url: jdbc:mysql://localhost:3306/media_website?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# 应用配置
server:
  port: 8081
  servlet:
    context-path: /api

# 文件存储配置
file:
  upload:
    path: /var/www/media/uploads
    url-prefix: /uploads
