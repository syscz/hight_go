spring:
  # 数据源配置
  datasource:
    url: jdbc:mysql://localhost:3306/media_website?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 2GB
    max-request-size: 2GB

# MyBatis 配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.media.website.entity
  configuration:
    map-underscore-to-camel-case: true

# 应用配置
server:
  port: 8081

# 文件存储配置
file:
  upload:
    path: /data/media/uploads
    url-prefix: /uploads

# JWT配置
jwt:
  secret: ${JWT_SECRET:hight-go-media-website-secret-key-2024}
  expiration: 86400000

# 账号安全配置
auth:
  # 注册邀请码：为空 = 关闭注册（生产通过 systemd 环境变量 AUTH_INVITE_CODE 覆盖）
  invite-code: ${AUTH_INVITE_CODE:}
  quota:
    max-total-bytes: ${AUTH_QUOTA_MAX_TOTAL_BYTES:2147483648}   # 每用户存储上限 2GB
    max-count: ${AUTH_QUOTA_MAX_COUNT:500}                      # 每用户媒体数量上限
    # 配额切换时间：此前注册的老用户不受配额限制（生产如需调整用环境变量 AUTH_QUOTA_APPLY_AFTER 覆盖）
    apply-after: ${AUTH_QUOTA_APPLY_AFTER:2026-10-14T00:00:00}
