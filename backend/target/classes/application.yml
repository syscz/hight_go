spring:
  # 数据源配置
  datasource:
    url: jdbc:mysql://localhost:3306/media_website?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 2GB
    max-request-size: 2GB

# 应用配置
server:
  port: 8081

# 文件存储配置
file:
  upload:
    path: /var/www/media/uploads
    url-prefix: /uploads

# JWT配置
jwt:
  secret: hight-go-media-website-secret-key-2024
  expiration: 86400000
